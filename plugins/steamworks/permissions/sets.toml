[[set]]
identifier = "allow-player-info"
description = "Reads whether Steam is available, its status, and the signed-in player's name, ID and language."
permissions = ["allow-is-available", "allow-get-status", "allow-get-player"]

[[set]]
identifier = "allow-achievements"
description = "Reads and unlocks achievements and shows their progress."
permissions = [
  "allow-get-achievement",
  "allow-unlock-achievement",
  "allow-indicate-achievement-progress",
]

[[set]]
identifier = "allow-achievements-dev"
description = "Re-locks achievements. Meant for development builds, so a shipped app cannot wipe a player's progress."
permissions = ["allow-clear-achievement"]

[[set]]
identifier = "allow-stats"
description = "Reads, writes and stores stats."
permissions = ["allow-get-stat", "allow-set-stat", "allow-store-stats"]

[[set]]
identifier = "allow-presence"
description = "Sets and clears rich presence, the status line friends see."
permissions = ["allow-set-rich-presence", "allow-clear-rich-presence"]

[[set]]
identifier = "allow-overlay"
description = "Opens Steam overlay pages and web pages."
permissions = ["allow-activate-overlay", "allow-activate-overlay-to-web-page"]

[[set]]
identifier = "allow-cloud"
description = "Reads, writes, lists and deletes Steam Cloud files, and reads the Cloud quota and status. Prefer Auto-Cloud for save games."
permissions = [
  "allow-cloud-write",
  "allow-cloud-read",
  "allow-cloud-delete",
  "allow-cloud-list",
  "allow-cloud-quota",
  "allow-cloud-status",
]

[[set]]
identifier = "allow-dlc"
description = "Lists the app's downloadable content and checks whether each is installed."
permissions = ["allow-get-dlc", "allow-is-dlc-installed"]

[[set]]
identifier = "allow-device"
description = "Reports whether the app runs on a Steam Deck or in Big Picture mode."
permissions = ["allow-get-device-info"]

[[set]]
identifier = "allow-screenshots"
description = "Hooks Steam screenshots, triggers one, and adds an image file to the player's Steam screenshot library."
permissions = [
  "allow-hook-screenshots",
  "allow-trigger-screenshot",
  "allow-add-screenshot-to-library",
]
