[package]
name = "tauri-plugin-desktop-integration"
version = "0.3.0"
description = "Desktop activation helpers for X11/Wayland window focus and global shortcuts"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
build = "build.rs"
links = "tauri-plugin-desktop-integration"

[package.metadata.platforms.support]
windows = { level = "partial", notes = "Toasts (with an AppUserModelID), sleep inhibit, taskbar progress and RegisterHotKey global shortcuts; type-checked for x86_64-pc-windows-msvc, not yet run on Windows" }
linux = { level = "full", notes = "X11 window activation via gdkx11, Wayland global shortcuts via the portal, notifications, logind sleep inhibit, launcher progress and FileManager1 over zbus" }
macos = { level = "none", notes = "X11/Wayland activation helpers only" }
android = { level = "none", notes = "X11/Wayland activation helpers only" }
ios = { level = "none", notes = "X11/Wayland activation helpers only" }

[lib]
name = "tauri_plugin_desktop_integration"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
log = { workspace = true }
raw-window-handle = "0.6"
serde = { workspace = true }
tauri = { workspace = true }
tauri-plugin-global-shortcut = "2"
tauri-plugin-xdg-portal = { path = "../xdg-portal", version = "0.3.0" }
thiserror = { workspace = true }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
ts-rs = "12"
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
gdk = "0.18"
gdkx11 = "0.18"
gtk = "0.18"

# The same version Tauri resolves.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
serde_json = { workspace = true }
tauri = { workspace = true, features = ["test"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "test-util"] }
